schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
context: |
  Tech stack: Astro, HTML5, CSS3, JavaScript
  Domain: Landing Page
  Conventions and style guides can be found in "docs/constitution.md".

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
    - The proposal must never contradict what is defined in "docs/constitution.md".
    - Before you start defining the proposal, ask the developer whether they want it in Spanish or English.
  tasks:
    - Break tasks into chunks of max 30 minuts
    - Upon completing a task, you should propose a commit message.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
